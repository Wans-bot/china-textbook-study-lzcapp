package: cloud.lazycat.app.china-textbook-study
version: 0.1.1
name: ChinaTextbookStudyFree
description: 中小学教材同步学习：按册按课做题，即时判分，错题本与间隔复习，课文听读与课外故事。
author: wuwangzhang1216
license: MIT
homepage: https://github.com/wuwangzhang1216/ChinaTextbookStudyFree
min_os_version: 1.6.0
support_mobile: true
permissions:
  required:
    - net.internet
locales:
  zh-CN:
    name: 教材同步学习
    description: >-
      按人教等主流教材的册次与课次整理的中小学练习：选择题即时判分，错题自动进错题本并按间隔复习排期；课文听读与课外故事带朗读，另有点数商店、成就、每周连续打卡等轻量激励。
    usage: |
      打开就是选册次，选完直接做题，不需要注册账号，也没有后台管理。

      怎么用：

      1. 首页按学段/年级/册次挑一本教材，进入后按课次做题。
      2. 每题提交后立刻出对错和解析，做错的题自动进「错题本」，按间隔复习排期再出现。
      3. 「课文听读」可以对着原文一句句听、跟着读；「课外故事」是配套分级读物，读完有阅读理解题。
      4. 答对攒点数，可以在商店里换小奖励，同时解锁成就和每周连续打卡。

      语言与数据：

      - 界面为简体中文。
      - 做题进度、错题本、点数与设置都保存在当前浏览器本地；换浏览器或清空浏览器数据会重新开始。
      - 音频与图片随应用内置，不依赖外部服务，断网也能做题。
  en:
    name: China Textbook Study
    description: >-
      Practice organised by textbook volume and lesson for primary and middle
      school, with instant scoring, an automatic mistake notebook on a
      spaced-repetition schedule, read-along passages and graded stories, plus a
      points shop, achievements and weekly streaks.
    usage: >
      Opens straight into picking a textbook volume - no account, no admin
      console.


      How to use:


      1. On the home page pick a stage, grade and volume; lessons are then
      listed in order.

      2. Every answer is scored immediately with an explanation; wrong answers
      go into the mistake notebook and come back on a spaced-repetition
      schedule.

      3. "Read-along" plays a passage sentence by sentence so you can repeat
      after it; "Stories" are graded readers with comprehension questions.

      4. Correct answers earn points to spend in the shop, and unlock
      achievements and weekly streaks.


      Language and data:


      - The interface is Simplified Chinese.

      - Progress, mistakes, points and settings live in the browser's local
      storage; a different browser or cleared site data starts from zero.

      - All audio and page images ship with the app, so it also works offline.


      Notes:


      - This is a containerised port of the upstream open-source project; the
      code is MIT licensed and the UI is upstream's own Simplified Chinese.
