usage: |
  按教材册次与课次整理的中小学同步练习，打开就能做题，不用注册。

  - 首页挑学段/年级/册次，进入后按课次做题，提交立刻判分并给解析。
  - 做错的题自动进「错题本」，按间隔复习排期再出现；另有每周连续打卡与成就。
  - 「课文听读」逐句朗读原文，「课外故事」是配套分级读物，读完有阅读理解题。

  界面为简体中文。做题进度、错题本、点数都保存在当前浏览器本地，
  换浏览器或清空浏览器数据会重新开始。音频与图片随应用内置，断网可用。
application:
  subdomain: ctsf
  routes:
    - /=http://web.cloud.lazycat.app.china-textbook-study.lzcapp:8080
  health_check:
    test_url: http://web.cloud.lazycat.app.china-textbook-study.lzcapp:8080/
    start_period: 30s
    timeout: 10s
    disable: false
  injects:
    - id: ctsf-file-bridge
      'on': request
      auth_required: false
      when:
        - /__lazycat_file_bridge/*
      do:
        - src: |
            const bridgePrefix = "/__lazycat_file_bridge";
            const requestHost = String(ctx.request.host || "")
              .split(":")[0]
              .toLowerCase();
            const firstDot = requestHost.indexOf(".");
            const method = String(ctx.request.method || "").toUpperCase();

            if (
              firstDot <= 0 ||
              /^\d{1,3}(\.\d{1,3}){3}$/.test(requestHost) ||
              !["GET", "HEAD", "PUT"].includes(method)
            ) {
              ctx.response.send(
                ["GET", "HEAD", "PUT"].includes(method) ? 400 : 405,
                "Invalid LazyCat file bridge request",
              );
              return;
            }

            const boxDomain = requestHost.slice(firstDot + 1);
            const fileOrigin = "https://file." + boxDomain;
            const targetPath =
              "/files/home" + ctx.request.path.slice(bridgePrefix.length);

            ctx.headers.del("Origin");
            ctx.headers.del("Referer");
            ctx.proxy.to(fileOrigin, {
              path: targetPath,
              query: ctx.request.raw_query,
              use_target_host: true,
              timeout_ms: 120000,
              on_fail: "error",
            });
    - id: ctsf-file-chooser-inject
      'on': browser
      when:
        - /*
      do:
        - src: >-
            file:///lzcapp/pkg/content/lazycat-injects/ctsf-file-chooser-inject.js
          params:
            diskRoot: /_lzc/files/home
            fileBridgeRoot: /__lazycat_file_bridge
            fallbackMime: application/octet-stream
            locale: auto
            hooks:
              fileSystemAccess: true
              fileInput: true
              downloadAnchor: true
services:
  web:
    image: registry.lazycat.cloud/wans/ctsf-1020-1429:4e7757c2574e1b46
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS -o /dev/null http://127.0.0.1:8080/ || exit 1
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 20
